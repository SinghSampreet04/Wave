services:

  postgres:

    image: postgres:17

    container_name: wave-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wave}
      POSTGRES_USER: ${POSTGRES_USER:-wave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wave-local-password}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:

    image: redis:7-alpine

    container_name: wave-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

  backend:

    build: .

    container_name: wave-backend

    restart: unless-stopped

    depends_on:
      - postgres
      - redis

    ports:
      - "8082:8082"

    environment:

      SERVER_PORT: 8082

      DB_URL: jdbc:postgresql://postgres:5432/wave
      DB_USERNAME: ${POSTGRES_USER:-wave}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-wave-local-password}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "1"
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "true"

      REDIS_HOST: redis
      REDIS_PORT: 6379

      JWT_SECRET: ${JWT_SECRET:-V2F2ZUxvY2FsRGV2ZWxvcG1lbnRLZXlGb3JKV1RUb2tlbnNSZXBsYWNlQmVmb3JlUHJvZHVjdGlvbjEyMzQ1Njc4OTA=}

      UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}

      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_HEALTH_ENABLED: ${MAIL_HEALTH_ENABLED:-false}

    volumes:
      - wave_uploads:/app/uploads

volumes:

  postgres_data:
  wave_uploads:
