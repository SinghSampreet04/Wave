spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

jwt.secret=${JWT_SECRET}
wave.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:true}

server.forward-headers-strategy=framework
server.shutdown=graceful
server.compression.enabled=true
server.error.include-message=never
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:25MB}

spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# SMTP is optional for deployments that do not enable onboarding email.
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}
