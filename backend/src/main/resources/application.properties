spring.application.name=backend

server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wave}
spring.datasource.username=${DB_USERNAME:wave}
spring.datasource.password=${DB_PASSWORD:wave-local-password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Safely adopt databases created before Flyway was introduced. Version 1 describes
# the existing schema, so only later migrations are applied to an adopted database.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

jwt.secret=${JWT_SECRET:V2F2ZUxvY2FsRGV2ZWxvcG1lbnRLZXlGb3JKV1RUb2tlbnNSZXBsYWNlQmVmb3JlUHJvZHVjdGlvbjEyMzQ1Njc4OTA=}

jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
wave.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}

wave.upload-dir=${UPLOAD_DIR:uploads}
wave.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
wave.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ==========================
# Redis
# ==========================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

# ==========================
# Email Configuration
# ==========================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================
# Rate Limiting
# ==========================

rate-limit.login-limit=5
rate-limit.login-window-seconds=60

rate-limit.register-limit=100
rate-limit.register-window-seconds=60

rate-limit.forgot-password-limit=3
rate-limit.forgot-password-window-seconds=3600

rate-limit.resend-verification-limit=3
rate-limit.resend-verification-window-seconds=3600

# ==========================
# Spring Boot Actuator
# ==========================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
# Missing SMTP credentials must not make the application/container unhealthy.
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

management.info.env.enabled=true

management.endpoint.metrics.access=unrestricted

info.app.name=Wave Backend
info.app.description=Real-Time Collaboration Platform
info.app.version=1.0.0
info.app.java.version=17
