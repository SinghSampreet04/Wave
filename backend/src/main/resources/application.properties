spring.application.name=backend

server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wave}
spring.datasource.username=${DB_USERNAME:sampreetsingh}
spring.datasource.password=${DB_PASSWORD:wave123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:V2F2ZVN1cGVyU2VjcmV0S2V5Rm9ySnd0QXV0aGVudGljYXRpb25DaGFuZ2VUaGlzQmVmb3JlUHJvZHVjdGlvbjEyMzQ1Njc4OQ==}

jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

wave.upload-dir=${UPLOAD_DIR:uploads}

# ==========================
# Redis
# ==========================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ==========================
# Email Configuration
# ==========================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================
# Rate Limiting
# ==========================

rate-limit.login-limit=5
rate-limit.login-window-seconds=60

rate-limit.register-limit=3
rate-limit.register-window-seconds=3600

rate-limit.forgot-password-limit=3
rate-limit.forgot-password-window-seconds=3600

rate-limit.resend-verification-limit=3
rate-limit.resend-verification-window-seconds=3600

# ==========================
# Spring Boot Actuator
# ==========================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=always

management.info.env.enabled=true

management.endpoint.metrics.access=unrestricted

info.app.name=Wave Backend
info.app.description=Real-Time Collaboration Platform
info.app.version=1.0.0
info.app.java.version=17